# Vigil — Docker Compose
# ─────────────────────────────────
# Brings up the entire system with one command:
#   docker-compose up
#
# Services:
#   api        → FastAPI REST service         http://localhost:8000
#   dashboard  → Streamlit SOC dashboard      http://localhost:8501
#   mlflow     → MLflow tracking UI           http://localhost:5000
#   kafka      → Kafka broker (basics)        localhost:9092
#   zookeeper  → Required by Kafka
#
# To run only specific services:
#   docker-compose up api dashboard mlflow

version: "3.9"

services:

  # ── FastAPI REST service ───────────────────────────────────────────────────
  api:
    build:
      context: .
      target: api
    container_name: owadd-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./mlruns:/app/mlruns       # persist MLflow runs locally
    restart: unless-stopped
    networks:
      - owadd-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Streamlit dashboard ────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      target: dashboard
    container_name: owadd-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - api
    volumes:
      - ./data/raw:/app/data/raw   # reuse downloaded NSL-KDD data
    restart: unless-stopped
    networks:
      - owadd-net

  # ── MLflow tracking server ─────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    container_name: owadd-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped
    networks:
      - owadd-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Zookeeper (required by Kafka) ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: owadd-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped
    networks:
      - owadd-net

  # ── Kafka broker ───────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: owadd-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    restart: unless-stopped
    networks:
      - owadd-net

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  mlflow-data:
    driver: local

# ── Network ────────────────────────────────────────────────────────────────────
networks:
  owadd-net:
    driver: bridge
